name: build

# ARM64 Windows runners are required: the CLANGARM64 toolchain is a native
# aarch64 environment and cannot run on an x64 runner. Public repositories get
# windows-11-arm hosted runners for free.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create the release
  actions: read     # fetch the artifact produced by the earlier run

jobs:
  build:
    # A tag must never rebuild: the commit it points at was already built and
    # smoke-tested when it landed. The release job below reuses that artifact.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-11-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSYS2 (CLANGARM64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          # setup-msys2 installs only what is listed here. The MSYS-level tools
          # (patch, autoconf, automake, libtool, diffutils, texinfo) are not
          # dependencies of the mingw packages, and objdump comes from llvm-tools,
          # not from -tools. scripts/config.sh checks for all of them up front.
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-autotools
            mingw-w64-clang-aarch64-make
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-llvm-tools
            mingw-w64-clang-aarch64-harfbuzz
            mingw-w64-clang-aarch64-gnutls
            mingw-w64-clang-aarch64-libtree-sitter
            mingw-w64-clang-aarch64-libxml2
            mingw-w64-clang-aarch64-zlib
            mingw-w64-clang-aarch64-freetype
            mingw-w64-clang-aarch64-librsvg
            mingw-w64-clang-aarch64-libwebp
            mingw-w64-clang-aarch64-sqlite3
            mingw-w64-clang-aarch64-lcms2
            mingw-w64-clang-aarch64-giflib
            mingw-w64-clang-aarch64-libjpeg-turbo
            mingw-w64-clang-aarch64-libpng
            mingw-w64-clang-aarch64-libtiff
            mingw-w64-clang-aarch64-git
            patch
            autoconf
            automake
            libtool
            diffutils
            texinfo

      - name: Install Inno Setup
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-inno.ps1

      - name: Build, package and test
        shell: msys2 {0}
        run: bash scripts/build-all.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: emacs-arm64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  release:
    # Tags only, and deliberately NOT dependent on the build job above: the build
    # it needs already happened in an earlier run for the same commit. So a tag
    # publishes an artifact CI has already verified instead of rebuilding it
    # (~30 minutes saved), and it can only ever publish a build that passed.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The release is named after the tag, so a tag disagreeing with the source
      # version would publish a correct binary under a misleading name.
      - name: Check the tag agrees with the source version
        shell: pwsh
        run: |
          $line = Get-Content scripts/config.sh | Where-Object { $_ -match 'EMACS_VERSION:=' } | Select-Object -First 1
          if (-not $line) { throw "could not find EMACS_VERSION in scripts/config.sh" }
          $version = ($line -split ':=', 2)[1].TrimEnd('}"').Trim()
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v$version-")) {
            throw "tag '$tag' does not agree with EMACS_VERSION '$version' in scripts/config.sh (expected a name starting with 'v$version-')"
          }
          Write-Host "tag $tag agrees with EMACS_VERSION $version"

      - name: Find the verified build for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = "${{ github.sha }}"
          $runs = gh run list --repo "$env:GITHUB_REPOSITORY" --commit $sha --status success --limit 5 --json databaseId | ConvertFrom-Json
          if (-not $runs) {
            throw "No successful workflow run found for commit $sha. Tag a commit that has already passed CI."
          }
          $id = $runs[0].databaseId
          Write-Host "reusing the artifacts from run $id (commit $sha)"
          gh run download $id --repo "$env:GITHUB_REPOSITORY" --name "emacs-arm64-$sha" -D dist

      - name: Check what was downloaded
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File
          $files | ForEach-Object { "  {0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          if ($files.Count -lt 4) { throw "expected the packaged artifacts in dist/, found $($files.Count) file(s)" }

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            GNU Emacs **31.1** for **Windows on ARM64** (aarch64), built from the official
            emacs-31.1 release with the four MSYS2 ARM64 patches applied.

            | File | Use |
            | --- | --- |
            | `emacs-31.1-aarch64-portable.zip` | **Recommended.** Extract anywhere, run `bin\runemacs.exe`. Runs on any Windows on ARM64 PC. |
            | `emacs-31.1-aarch64-setup.exe` | Installer for the same build: Start Menu entries, optional PATH entry, uninstaller. |
            | `emacs-31.1-aarch64-native-portable.zip` | Built with `-mcpu=native` on the build machine's CPU. **Not portable** - it may not start on other ARM64 machines. |
            | `emacs-31.1-aarch64-native-setup.exe` | Installer for the native build. |
            | `BUILD-INFO.txt`, `PACKAGES.txt` | Toolchain, date and the exact MSYS2 package versions used. |

            Requires 64-bit ARM Windows; it will not run on x86-64. There is no native Lisp
            compilation on this platform (`libgccjit` does not exist for clangarm64), and the
            binaries are unsigned, so expect SmartScreen warnings.

            GNU Emacs is free software under the GPL-3.0-or-later; each archive ships `COPYING`
            and `SOURCE-CODE.txt`.
